    expectation: "body[start:end] == quote with 0 <= start < end <= len(body)"
    fixture: "semantic-bundle.json"
  - id: "canonical-hash"
    expectation: "sha256(canonical_body) == canonical_body_sha256"
    fixture: "semantic-bundle.json"
  - id: "field-coverage-facts"
    expectation: "nonempty FACT fields (title/summary/subject_name/feature_keys) subset of evidence-covered fields"
    fixture: "semantic-bundle.json"
  - id: "entity-type-classification"
    expectation: "entity_type enum-checked + provenance normalized; no quote required"
    fixture: "semantic-bundle.json"
  - id: "shanghai-c3-shape"
    expectation: "6 candidates, 25 exact evidence refs, 3 full canonical sources, Akanee revision=2 others=1, duplicates=0"
    fixture: "semantic-bundle.json"
  - id: "no-eaten-claim"
    expectation: "score never claims eaten/reviewed; unknowns preserved"
    fixture: "semantic-bundle.json"
