[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.6.0"
description = "CTFS 模块化数据中台：M0-M7 八个独立工具模块 + Manifest/本体包驱动（PRD v2.1 Phase 0 骨架）"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[project.scripts]
toolbox = "toolbox.cli:app"

[tool.setuptools.packages.find]
include = ["toolbox*"]
