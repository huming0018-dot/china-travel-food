# docker-compose.yml — 上海美食图鉴·云端采集常驻服务（生产）
# 容器内 cron 每 20 分钟跑一轮；电脑/本机是否在线都不影响。
services:
  food-cloud:
    image: food-cloud:local
    container_name: food-cloud
    restart: always
    env_file: ./deploy.env
    environment:
      - TZ=Asia/Shanghai
      - BATCH=15              # production_runner 等现行消费者仍使用的批量设置
    volumes:
      - fooddata:/app/data                                  # 采集断点/日志持久化
      - ./xhs_accounts:/secrets/xhs_accounts:ro             # 多账号 cookie 池（加号=丢文件）
      - ./xhs_cookies.json:/secrets/xhs_cookies.json:ro     # 旧单账号（回退用，只读）

volumes:
  fooddata:
