name: Review reporting regression
on:
  push:
    paths:
      - 'app/lib/report.ts'
      - 'cloud/tests/review-reporting*.mjs'
      - 'cloud/supabase/migrations/*report*.sql'
      - '.github/workflows/review-reporting.yml'
  pull_request:
    paths:
      - 'app/lib/report.ts'
      - 'cloud/tests/review-reporting*.mjs'
      - 'cloud/supabase/migrations/*report*.sql'
      - '.github/workflows/review-reporting.yml'
permissions:
  contents: read
jobs:
  reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: reporting_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: reporting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reporting_test -d reporting_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/report-tools" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 pg@8.16.3
      - name: Isolated permissions, failure and frontend contract regression
        run: CROWD_TEST_TOOLS="$RUNNER_TEMP/report-tools" node cloud/tests/review-reporting.mjs
      - name: Real PostgreSQL multi-connection concurrency regression
        env:
          REPORT_TEST_DISPOSABLE: 'yes'
          REPORT_TEST_DATABASE_URL: postgresql://reporting_test:disposable-test-only@localhost:5432/reporting_test
        run: CROWD_TEST_TOOLS="$RUNNER_TEMP/report-tools" node cloud/tests/review-reporting-concurrency.mjs
