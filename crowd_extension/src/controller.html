<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://*.supabase.co; form-action 'none'; base-uri 'none'"><title>众包公开笔记采集</title><link rel="stylesheet" href="controller.css"></head>
<body><main><h1>众包公开笔记采集</h1>
<p>自愿参与内部研究。启动后自动领取任务、搜索与采集公开笔记。遇到验证码、登录失效或限流会暂停，请在工作页面处理后重新启动。</p>
<p id="welcome">请从邀请链接打开。确认参与后自动接入，无需注册中台账号或等待审核。</p>
<details id="invitation"><summary>重新打开邀请</summary><form id="invite_form"><label>邀请链接<input id="invite_value" type="text" autocomplete="off" required></label><button>接续邀请</button></form></details>
<section><label><input id="agree" type="checkbox">我自愿参加，并同意自动访问公开网页及回传笔记正文、字段和采集证据。小红书登录凭据留在本机。按核验通过且去重后的笔记累计，每 100 条奖励 ¥0.10；不足 100 条继续累计。我了解后台运行受系统限制，可随时停止。</label><button id="consent">同意并开始</button></section>
<nav><button id="open_login">登录小红书 / 处理验证</button><button id="start">继续采集</button><button id="stop">停止</button></nav>
<p id="message" role="status" aria-live="polite"></p><details><summary>查看进度与高级账户选项</summary><dl id="status"></dl><button id="refresh">刷新状态</button><button id="logout">退出参与身份</button><button id="export">导出未回传证据</button><form id="login"><label>已有中台账户邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button>登录</button><button type="button" id="signup">注册</button></form></details>
<p>保持浏览器运行即可在工作标签页采集。手机后台批次由本机系统安排，挂起后保留进度，下次继续。不会自动破解验证。</p>
</main><script src="config.js"></script><script src="core.js"></script><script src="api.js"></script><script src="agent.js"></script><script src="join.js"></script><script src="native-runtime.js"></script><script src="controller.js"></script></body></html>
