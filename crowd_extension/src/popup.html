<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>众包采集状态</title>
<style>
body{width:300px;font-family:-apple-system,'PingFang SC',sans-serif;padding:14px;font-size:13px;color:#1a1a2e}
h1{font-size:15px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f0f0}
.label{color:#6b7280}
.val{font-weight:600}
.btn{width:100%;padding:8px;margin-top:10px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-start{background:#b45309;color:#fff}
.btn-stop{background:#e5e7eb;color:#374151}
.status-ok{color:#059669}.status-warn{color:#b45309}.status-bad{color:#dc2626}
</style>
</head>
<body>
<h1>🍜 美食图鉴·众包采集</h1>
<div id="status">
  <div class="row"><span class="label">状态</span><span class="val" id="s_state">—</span></div>
  <div class="row"><span class="label">今日搜索</span><span class="val" id="s_searches">—</span></div>
  <div class="row"><span class="label">冷却</span><span class="val" id="s_cooldown">—</span></div>
  <div class="row"><span class="label">待回传</span><span class="val" id="s_queue">—</span></div>
  <div class="row"><span class="label">当前任务</span><span class="val" id="s_task">—</span></div>
  <div class="row"><span class="label">参与编号</span><span class="val" id="s_pid">—</span></div>
  <div class="row"><span class="label">拦截原因</span><span class="val" id="s_gate">—</span></div>
</div>
<button class="btn btn-start" id="start">▶ 启动采集</button>
<button class="btn btn-stop" id="stop">⏸ 停止</button>
<script>
const $ = (id) => document.getElementById(id);
function render(status) {
  $("s_state").textContent = "运行中";
  $("s_state").className = "val status-ok";
  const d = status.day || {};
  $("s_searches").textContent = (d.searches || 0) + " 次";
  if (status.cooldown && status.cooldown.active) {
    $("s_cooldown").textContent = "冷却 " + status.cooldown.leftMin + "min";
    $("s_cooldown").className = "val status-warn";
  } else {
    $("s_cooldown").textContent = "无";
    $("s_cooldown").className = "val status-ok";
  }
  $("s_queue").textContent = status.queueLen + " 条";
  $("s_task").textContent = status.activeTask ? "#" + status.activeTask.task_id + "(" + status.activeTask.pack_len + "项)" : "无";
  $("s_pid").textContent = status.participantId || "未填写";
  const gate = status.gateBlockReason || "";
  $("s_gate").textContent = gate || "正常";
  $("s_gate").className = gate ? "val status-bad" : "val status-ok";
}
chrome.runtime.sendMessage({ type: "CROWD_STATUS" }, (resp) => {
  if (resp) render(resp);
  else $("s_state").textContent = "未就绪(需参与协议)";
});
$("start").onclick = () => chrome.runtime.sendMessage({ type: "CROWD_START" }, () => {
  chrome.runtime.sendMessage({ type: "CROWD_STATUS" }, render);
});
$("stop").onclick = () => chrome.runtime.sendMessage({ type: "CROWD_STOP" }, () => {
  $("s_state").textContent = "已停止"; $("s_state").className = "val status-warn";
});
</script>
</body>
</html>
